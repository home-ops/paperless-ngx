# yamllint disable rule:line-length
name: Build and scan pull request image

on:
  pull_request:
    paths:
      - Dockerfile
      - README.md
      - renovate.json
      - .github/workflows/**

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate documented image tag format
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '[0-9]+\.[0-9]+\.[0-9]+-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{12}' README.md

      - name: Validate documented source vulnerability reports
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '[`reports/source-vulnerabilities.md`](reports/source-vulnerabilities.md)' README.md
          grep -Fq '[`reports/source-vulnerabilities.json`](reports/source-vulnerabilities.json)' README.md

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build local image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: paperless-ngx:pull-request

      - name: Build local non-root image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          target: nonroot
          push: false
          load: true
          tags: paperless-ngx:nonroot-pull-request

      - name: Validate non-root identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint id paperless-ngx:pull-request -u)" = 0
          test "$(docker run --rm --entrypoint id paperless-ngx:pull-request -g)" = 0
          test "$(docker run --rm --entrypoint id paperless-ngx:nonroot-pull-request -u)" = 1000
          test "$(docker run --rm --entrypoint id paperless-ngx:nonroot-pull-request -g)" = 1000
          test "$(docker run --rm --user 12345:23456 --group-add 34567 --entrypoint id paperless-ngx:nonroot-pull-request -u)" = 12345
          test "$(docker run --rm --user 12345:23456 --group-add 34567 --entrypoint id paperless-ngx:nonroot-pull-request -g)" = 23456

      - name: Validate arbitrary UID filesystem writes
        shell: bash
        run: |
          set -euo pipefail
          data_dir=''
          media_dir=''
          consume_dir=''
          export_dir=''
          scratch_dir=''
          cleanup() {
            sudo rm -rf -- "$data_dir" "$media_dir" "$consume_dir" "$export_dir" "$scratch_dir"
          }
          trap cleanup EXIT

          data_dir="$(mktemp -d)"
          media_dir="$(mktemp -d)"
          consume_dir="$(mktemp -d)"
          export_dir="$(mktemp -d)"
          scratch_dir="$(mktemp -d)"
          sudo chown 0:34567 "$data_dir" "$media_dir" "$consume_dir" "$export_dir" "$scratch_dir"
          sudo chmod 2770 "$data_dir" "$media_dir" "$consume_dir" "$export_dir" "$scratch_dir"

          docker run --rm \
            --entrypoint sh \
            --user 12345:23456 \
            --group-add 34567 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /run:rw,exec,mode=1777 \
            --tmpfs /tmp:rw,mode=1777 \
            --tmpfs /var/cache/fontconfig:rw,mode=1777 \
            --mount "type=bind,src=$data_dir,dst=/usr/src/paperless/data" \
            --mount "type=bind,src=$media_dir,dst=/usr/src/paperless/media" \
            --mount "type=bind,src=$consume_dir,dst=/usr/src/paperless/consume" \
            --mount "type=bind,src=$export_dir,dst=/usr/src/paperless/export" \
            --mount "type=bind,src=$scratch_dir,dst=/usr/src/paperless/scratch" \
            paperless-ngx:nonroot-pull-request \
            -c 'for path in /usr/src/paperless/data /usr/src/paperless/media /usr/src/paperless/consume /usr/src/paperless/export /usr/src/paperless/scratch /tmp /run /var/cache/fontconfig; do file="$path/.arbitrary-uid-write-test"; touch "$file"; rm "$file"; done'

      - name: Start arbitrary UID image and test document processing
        shell: bash
        run: |
          set -euo pipefail
          data_dir=''
          media_dir=''
          consume_dir=''
          export_dir=''
          scratch_dir=''
          fixture_dir=''
          container_id=''
          redis_id=''
          network_name="paperless-ci-health-${GITHUB_RUN_ID:-local}"
          admin_password='ci-health-password'
          cleanup() {
            if [[ -n "$container_id" ]]; then
              docker logs "$container_id" >&2 || true
              docker rm -f "$container_id" >/dev/null 2>&1 || true
            fi
            if [[ -n "$redis_id" ]]; then
              docker rm -f "$redis_id" >/dev/null 2>&1 || true
            fi
            docker network rm "$network_name" >/dev/null 2>&1 || true
            sudo rm -rf -- "$data_dir" "$media_dir" "$consume_dir" "$export_dir" "$scratch_dir" "$fixture_dir"
          }
          trap cleanup EXIT

          docker network create "$network_name" >/dev/null
          redis_id="$(docker run -d --network "$network_name" --network-alias redis redis:7.4-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7)"
          for attempt in {1..30}; do
            if docker exec "$redis_id" redis-cli ping 2>/dev/null | grep -qx PONG; then
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' "$redis_id" 2>/dev/null | grep -qx true; then
              docker logs "$redis_id" >&2 || true
              exit 1
            fi
            sleep 1
          done
          docker exec "$redis_id" redis-cli ping | grep -qx PONG

          data_dir="$(mktemp -d)"
          media_dir="$(mktemp -d)"
          consume_dir="$(mktemp -d)"
          export_dir="$(mktemp -d)"
          scratch_dir="$(mktemp -d)"
          fixture_dir="$(mktemp -d)"
          sudo chown 0:34567 "$data_dir" "$media_dir" "$consume_dir" "$export_dir" "$scratch_dir"
          sudo chmod 2770 "$data_dir" "$media_dir" "$consume_dir" "$export_dir" "$scratch_dir"
          PDF_PATH="$fixture_dir/arbitrary-uid-test.pdf" python3 - <<'PY'
          import os
          from pathlib import Path

          objects = [
              b"<< /Type /Catalog /Pages 2 0 R >>",
              b"<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
              b"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>",
              b"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>",
          ]
          stream = b"BT /F1 40 Tf 72 500 Td (ARBITRARY UID OCR TEST) Tj ET"
          objects.append(b"<< /Length %d >>\nstream\n%s\nendstream" % (len(stream), stream))
          pdf = bytearray(b"%PDF-1.4\n")
          offsets = [0]
          for number, item in enumerate(objects, 1):
              offsets.append(len(pdf))
              pdf.extend(f"{number} 0 obj\n".encode() + item + b"\nendobj\n")
          xref = len(pdf)
          pdf.extend(f"xref\n0 {len(offsets)}\n".encode() + b"0000000000 65535 f \n")
          for offset in offsets[1:]:
              pdf.extend(f"{offset:010d} 00000 n \n".encode())
          pdf.extend(
              f"trailer\n<< /Size {len(offsets)} /Root 1 0 R >>\n"
              f"startxref\n{xref}\n%%EOF\n".encode()
          )
          Path(os.environ["PDF_PATH"]).write_bytes(pdf)
          PY
          sudo chown 0:34567 "$fixture_dir"
          sudo chmod 2750 "$fixture_dir"

          container_id="$(docker run -d \
            --network "$network_name" \
            --user 12345:23456 \
            --group-add 34567 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --publish 127.0.0.1:18000:8000 \
            --tmpfs /run:rw,exec,mode=1777 \
            --tmpfs /tmp:rw,mode=1777 \
            --tmpfs /var/cache/fontconfig:rw,mode=1777 \
            --mount "type=bind,src=$data_dir,dst=/usr/src/paperless/data" \
            --mount "type=bind,src=$media_dir,dst=/usr/src/paperless/media" \
            --mount "type=bind,src=$consume_dir,dst=/usr/src/paperless/consume" \
            --mount "type=bind,src=$export_dir,dst=/usr/src/paperless/export" \
            --mount "type=bind,src=$scratch_dir,dst=/usr/src/paperless/scratch" \
            --mount "type=bind,src=$fixture_dir,dst=/test-fixtures,readonly" \
            --env PAPERLESS_DBENGINE=sqlite \
            --env PAPERLESS_REDIS=redis://redis:6379 \
            --env PAPERLESS_SECRET_KEY=ci-only-paperless-secret-key-for-health-check-not-for-production \
            --env PAPERLESS_ADMIN_USER=ci \
            --env PAPERLESS_ADMIN_PASSWORD="$admin_password" \
            --env PAPERLESS_ADMIN_MAIL=ci@example.invalid \
            --env PAPERLESS_SCRATCH_DIR=/usr/src/paperless/scratch \
            --env PAPERLESS_OCR_MODE=force \
            --env PAPERLESS_CONSUMER_POLLING=1 \
            paperless-ngx:nonroot-pull-request)"

          status='000'
          healthy=false
          for attempt in {1..30}; do
            if ! docker inspect -f '{{.State.Running}}' "$container_id" 2>/dev/null | grep -qx true; then
              echo 'Container exited before becoming healthy' >&2
              docker logs "$container_id" >&2 || true
              exit 1
            fi
            token="$(curl --silent --show-error --fail --max-time 5 \
              --header 'Content-Type: application/json' \
              --data "{\"username\":\"ci\",\"password\":\"$admin_password\"}" \
              http://127.0.0.1:18000/api/token/ 2>/dev/null | ruby -rjson -e 'puts JSON.parse(STDIN.read).fetch("token")' 2>/dev/null || true)"
            if [[ -n "$token" ]]; then
              response="$(curl --silent --show-error --max-time 5 \
                --header "Authorization: Token $token" \
                --write-out $'\n%{http_code}' \
                http://127.0.0.1:18000/api/status/ || true)"
              status="${response##*$'\n'}"
              body="${response%$'\n'*}"
              if [[ "$status" = 200 ]] && ruby -rjson -e 'data=JSON.parse(STDIN.read); abort unless data.dig("database", "status") == "OK" && data.dig("tasks", "redis_status") == "OK"' <<<"$body"; then
                healthy=true
                break
              fi
            fi
            sleep 2
          done
          if [[ "$healthy" != true ]]; then
            echo "HTTP health check timed out; last status: $status; endpoint: /api/status/" >&2
            docker logs "$container_id" >&2 || true
            exit 1
          fi

          docker exec "$container_id" sh -c 'cp /test-fixtures/arbitrary-uid-test.pdf /usr/src/paperless/consume/arbitrary-uid-test.pdf'
          processed=false
          for attempt in {1..60}; do
            if curl --silent --show-error --fail --max-time 5 \
              --header "Authorization: Token $token" \
              http://127.0.0.1:18000/api/documents/?page_size=100 |
              ruby -rjson -e 'abort unless JSON.parse(STDIN.read).fetch("results").any? { |document| document.fetch("content", "").include?("ARBITRARY UID OCR TEST") }'; then
              processed=true
              break
            fi
            sleep 2
          done
          if [[ "$processed" != true ]]; then
            echo 'OCR consumption timed out; Paperless did not index the expected text' >&2
            docker logs "$container_id" >&2 || true
            exit 1
          fi

          docker exec "$container_id" sh -c 'find /usr/src/paperless/media/documents/thumbnails -type f | grep -q .'
          docker exec "$container_id" /command/with-contenv python3 \
            /usr/src/paperless/src/manage.py document_exporter /usr/src/paperless/export
          docker exec "$container_id" sh -c 'find /usr/src/paperless/export -type f | grep -q .'
          if docker logs "$container_id" 2>&1 | grep -Fq '[init-folders] WARNING: No write permission'; then
            echo 'Paperless reported a non-writable application directory' >&2
            exit 1
          fi

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1

      - name: Scan local image
        shell: bash
        # Findings are informational: the upstream image always carries known
        # vulnerabilities, so a non-zero exit code here would block every pull
        # request, including Renovate upstream updates. Trivy execution failures
        # still fail this step via `set -e`.
        run: |
          set -euo pipefail
          trivy image \
            --scanners vuln \
            --severity CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN \
            --timeout 10m \
            --parallel 1 \
            --exit-code 0 \
            paperless-ngx:pull-request

      - name: Scan non-root image
        shell: bash
        # Findings are informational: the upstream image always carries known
        # vulnerabilities, so a non-zero exit code here would block every pull
        # request, including Renovate upstream updates. Trivy execution failures
        # still fail this step via `set -e`.
        run: |
          set -euo pipefail
          trivy image \
            --scanners vuln \
            --severity CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN \
            --timeout 10m \
            --parallel 1 \
            --exit-code 0 \
            paperless-ngx:nonroot-pull-request
