# yamllint disable rule:line-length
name: Build and scan image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - renovate.json
      - .github/workflows/**
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-${{ github.workflow }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/home-ops/paperless-ngx
  NONROOT_IMAGE: ghcr.io/home-ops/paperless-ngx-nonroot
  TRIVY_SCANNERS: vuln
  TRIVY_SEVERITY: CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN
  TRIVY_TIMEOUT: 10m

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare reports directory
        shell: bash
        run: mkdir -p reports

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image references
        id: derive
        shell: bash
        run: |
          set -euo pipefail
          upstream_ref="$(sed -nE 's/^FROM (ghcr\.io\/paperless-ngx\/paperless-ngx:[^@ ]+@sha256:[0-9a-f]+).*/\1/p' Dockerfile)"
          upstream_version="$(sed -nE 's/^FROM ghcr\.io\/paperless-ngx\/paperless-ngx:([^@ ]+)@sha256:.*/\1/p' Dockerfile)"
          if [[ -z "$upstream_ref" || -z "$upstream_version" ]]; then
            echo 'Could not derive pinned upstream reference from Dockerfile' >&2
            exit 1
          fi
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'GITHUB_SHA must be exactly 40 lowercase hexadecimal characters' >&2
            exit 1
          fi
          immutable_tag="${upstream_version}-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA:0:12}"
          {
            echo "UPSTREAM_REF=$upstream_ref"
            echo "IMMUTABLE_REF=${IMAGE}:${immutable_tag}"
            echo "NONROOT_IMMUTABLE_REF=${NONROOT_IMAGE}:${immutable_tag}"
          } >> "$GITHUB_ENV"
          echo "upstream_version=$upstream_version" >> "$GITHUB_OUTPUT"
          {
            echo "### Image references"
            echo "- Upstream: \`$upstream_ref\`"
            echo "- Immutable: \`${IMAGE}:${immutable_tag}\`"
            echo "- Non-root immutable: \`${NONROOT_IMAGE}:${immutable_tag}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out pinned upstream source
        id: upstream-source
        shell: bash
        env:
          UPSTREAM_VERSION: ${{ steps.derive.outputs.upstream_version }}
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/paperless-ngx-source"
          git clone --quiet --depth 1 --branch "v${UPSTREAM_VERSION}" \
            https://github.com/paperless-ngx/paperless-ngx.git "$source_dir"
          echo "path=$source_dir" >> "$GITHUB_OUTPUT"
          echo "commit=$(git -C "$source_dir" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1

      - name: Scan source repositories
        shell: bash
        env:
          UPSTREAM_SOURCE_PATH: ${{ steps.upstream-source.outputs.path }}
        run: |
          set -euo pipefail
          source_scan_dir="$RUNNER_TEMP/trivy-source"
          mkdir -p "$source_scan_dir"
          trivy repo --scanners vuln --exit-code 0 --format json \
            --output "$source_scan_dir/wrapper.json" .
          trivy repo --scanners vuln --exit-code 0 --format json \
            --output "$source_scan_dir/upstream.json" "$UPSTREAM_SOURCE_PATH"

      - name: Generate source vulnerability summaries
        shell: bash
        env:
          UPSTREAM_COMMIT: ${{ steps.upstream-source.outputs.commit }}
          UPSTREAM_SOURCE_URL: https://github.com/paperless-ngx/paperless-ngx
          WRAPPER_SOURCE_URL: https://github.com/${{ github.repository }}
          WRAPPER_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          source_scan_dir="$RUNNER_TEMP/trivy-source"
          scan_date="$(date -u +%Y-%m-%d) UTC"
          scan_timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          trivy_version="$(trivy --version | sed -n '1s/^Version: //p')"
          if [[ -z "$trivy_version" ]]; then
            echo 'Could not determine Trivy version' >&2
            exit 1
          fi
          severities=(CRITICAL HIGH MEDIUM LOW UNKNOWN)

          count() {
            jq --arg severity "$1" \
              '[.Results[]?.Vulnerabilities[]? | select(.Severity == $severity)] | length' \
              "$2"
          }

          totals() {
            local file="$1"
            jq -n \
              --argjson critical "$(count CRITICAL "$file")" \
              --argjson high "$(count HIGH "$file")" \
              --argjson medium "$(count MEDIUM "$file")" \
              --argjson low "$(count LOW "$file")" \
              --argjson unknown "$(count UNKNOWN "$file")" \
              '{critical: $critical, high: $high, medium: $medium, low: $low, unknown: $unknown}'
          }

          upstream_totals="$(totals "$source_scan_dir/upstream.json")"
          wrapper_totals="$(totals "$source_scan_dir/wrapper.json")"

          mkdir -p reports
          jq -n \
            --arg scan_date "$scan_timestamp" \
            --arg trivy_version "$trivy_version" \
            --arg upstream_url "$UPSTREAM_SOURCE_URL" \
            --arg upstream_commit "$UPSTREAM_COMMIT" \
            --arg wrapper_url "$WRAPPER_SOURCE_URL" \
            --arg wrapper_commit "$WRAPPER_COMMIT" \
            --argjson upstream_totals "$upstream_totals" \
            --argjson wrapper_totals "$wrapper_totals" \
            '{
              scanDate: $scan_date,
              trivyVersion: $trivy_version,
              scanner: "vuln",
              upstream: {url: $upstream_url, commit: $upstream_commit, severityTotals: $upstream_totals},
              wrapper: {url: $wrapper_url, commit: $wrapper_commit, severityTotals: $wrapper_totals}
            }' > reports/source-vulnerabilities.json

          {
            echo '# Source repository vulnerability summary'
            echo
            echo 'Generated by GitHub Actions. Vulnerability scanner only; detailed Trivy JSON is in workflow artifacts.'
            echo
            echo "Scan date: $scan_date  "
            echo 'Scanner scope: `vuln` only (source and dependency-manifest findings).'
            echo
            echo 'Repositories have different dependency inventories. Counts are descriptive and are not a remediation delta.'
            echo
            echo '## Upstream Paperless-ngx source'
            echo
            echo "Repository: $UPSTREAM_SOURCE_URL  "
            echo "Commit: \`$UPSTREAM_COMMIT\`"
            echo
            echo '| Severity | Findings |'
            echo '| --- | ---: |'
            for severity in "${severities[@]}"; do
              lower="$(printf '%s' "$severity" | tr '[:upper:]' '[:lower:]')"
              echo "| $severity | $(jq -r ".$lower" <<< "$upstream_totals") |"
            done
            echo
            echo '## Wrapper repository source'
            echo
            echo "Repository: $WRAPPER_SOURCE_URL  "
            echo "Commit: \`$WRAPPER_COMMIT\`"
            echo
            echo '| Severity | Findings |'
            echo '| --- | ---: |'
            for severity in "${severities[@]}"; do
              lower="$(printf '%s' "$severity" | tr '[:upper:]' '[:lower:]')"
              echo "| $severity | $(jq -r ".$lower" <<< "$wrapper_totals") |"
            done
          } > reports/source-vulnerabilities.md

      - name: Reject existing immutable tags
        shell: bash
        # This check is advisory only. Registry-side tag immutability is required
        # to make the check-then-push sequence safe against concurrent runs.
        run: |
          set -euo pipefail
          check_tag() {
            local ref="$1"
            local inspect_output inspect_status
            set +e
            inspect_output="$(docker manifest inspect "$ref" 2>&1)"
            inspect_status=$?
            set -e
            if [[ $inspect_status -eq 0 ]]; then
              echo "Immutable tag already exists: $ref" >&2
              return 1
            fi
            if [[ "$inspect_output" == *'manifest unknown'* ||
                  "$inspect_output" == *'no such manifest'* ||
                  "$inspect_output" == *'name unknown'* ||
                  "$inspect_output" == *'404 Not Found'* ]]; then
              echo "Immutable tag does not exist: $ref"
              return 0
            fi
            echo "Could not determine whether immutable tag exists: $ref" >&2
            printf '%s\n' "$inspect_output" >&2
            return 1
          }
          check_tag "$IMMUTABLE_REF"
          check_tag "$NONROOT_IMMUTABLE_REF"

      - name: Build immutable image
        # Configure GHCR/package tag immutability outside this workflow. A push
        # conflict must fail here; this workflow must not overwrite an immutable tag.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMMUTABLE_REF }}

      - name: Build non-root immutable image
        # Build both variants before either immutable tag is published. Registry
        # tag immutability still protects the later push from overwrites.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          target: nonroot
          load: true
          tags: ${{ env.NONROOT_IMMUTABLE_REF }}

      - name: Scan pinned upstream image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          trivy_tmpdir="$RUNNER_TEMP/trivy"
          rm -rf "$trivy_tmpdir"
          mkdir -p "$trivy_tmpdir"
          export TMPDIR="$trivy_tmpdir"
          trivy image \
            --scanners "$TRIVY_SCANNERS" \
            --severity "$TRIVY_SEVERITY" \
            --timeout "$TRIVY_TIMEOUT" \
            --parallel 1 \
            --exit-code 0 \
            --format json \
            --output reports/upstream.json \
            "$UPSTREAM_REF"

      - name: Scan built immutable image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          trivy_tmpdir="$RUNNER_TEMP/trivy"
          rm -rf "$trivy_tmpdir"
          mkdir -p "$trivy_tmpdir"
          export TMPDIR="$trivy_tmpdir"
          trivy image \
            --scanners "$TRIVY_SCANNERS" \
            --severity "$TRIVY_SEVERITY" \
            --timeout "$TRIVY_TIMEOUT" \
            --parallel 1 \
            --exit-code 0 \
            --format json \
            --output reports/immutable.json \
            "$IMMUTABLE_REF"

      - name: Scan built non-root immutable image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          trivy_tmpdir="$RUNNER_TEMP/trivy"
          rm -rf "$trivy_tmpdir"
          mkdir -p "$trivy_tmpdir"
          export TMPDIR="$trivy_tmpdir"
          trivy image \
            --scanners "$TRIVY_SCANNERS" \
            --severity "$TRIVY_SEVERITY" \
            --timeout "$TRIVY_TIMEOUT" \
            --parallel 1 \
            --exit-code 0 \
            --format json \
            --output reports/nonroot.json \
            "$NONROOT_IMMUTABLE_REF"

      - name: Publish immutable images
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMMUTABLE_REF"
          docker push "$NONROOT_IMMUTABLE_REF"

      - name: Generate vulnerability comparison
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f reports/upstream.json || ! -f reports/immutable.json ]]; then
            exit 0
          fi

          has_nonroot=false
          if [[ -f reports/nonroot.json ]]; then
            has_nonroot=true
          fi

          count() {
            jq --arg severity "$1" \
              '[.Results[]?.Vulnerabilities[]? | select(.Severity == $severity)] | length' "$2"
          }

          details() {
            jq -r '
              "| ID | Package | Installed | Fixed | Severity | Title |\n| --- | --- | --- | --- | --- | --- |",
              (.Results[]?.Vulnerabilities[]? |
                "| \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "") | \(.Severity) | \(.Title // "") |")
            ' "$1"
          }

          {
            echo '# Trivy vulnerabilities: pinned upstream'
            echo
            details reports/upstream.json
          } > reports/upstream.md

          {
            echo '# Trivy vulnerabilities: built immutable'
            echo
            details reports/immutable.json
          } > reports/immutable.md

          if [[ "$has_nonroot" == true ]]; then
            {
              echo '# Trivy vulnerabilities: built non-root immutable'
              echo
              details reports/nonroot.json
            } > reports/nonroot.md
          fi

          {
            echo '# Trivy vulnerability comparison'
            echo
            echo "Upstream reference: \`$UPSTREAM_REF\`"
            echo "Immutable reference: \`$IMMUTABLE_REF\`"
            if [[ "$has_nonroot" == true ]]; then
              echo "Non-root reference: \`$NONROOT_IMMUTABLE_REF\`"
            fi
            echo
            if [[ "$has_nonroot" == true ]]; then
              echo '| Severity | Pinned upstream | Built immutable | Built non-root |'
              echo '| --- | ---: | ---: | ---: |'
            else
              echo '| Severity | Pinned upstream | Built immutable |'
              echo '| --- | ---: | ---: |'
            fi
            for severity in CRITICAL HIGH MEDIUM LOW UNKNOWN; do
              if [[ "$has_nonroot" == true ]]; then
                echo "| $severity | $(count "$severity" reports/upstream.json) | $(count "$severity" reports/immutable.json) | $(count "$severity" reports/nonroot.json) |"
              else
                echo "| $severity | $(count "$severity" reports/upstream.json) | $(count "$severity" reports/immutable.json) |"
              fi
            done
          } > reports/comparison.md

          change() {
            jq -n --argjson before "$(count "$1" reports/upstream.json)" \
              --argjson after "$(count "$1" reports/immutable.json)" \
              '$after - $before'
          }

          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          immutable_tag="${IMMUTABLE_REF##*:}"
          scan_date="$(date -u +%Y-%m-%d) UTC"
          {
            echo '# Trivy Before/After'
            echo
            echo 'Generated by GitHub Actions. Do not edit manually.'
            echo
            echo '## Latest Scan'
            echo
            echo "Scan date: $scan_date  "
            echo "Workflow run: [$GITHUB_RUN_ID]($run_url)"
            echo
            echo '| Severity | Before: upstream | After: rebuilt | Change |'
            echo '|:---:|---:|---:|---:|'
            for severity in CRITICAL HIGH MEDIUM LOW UNKNOWN; do
              case "$severity" in
                CRITICAL) icon=':red_circle:'; label='Critical' ;;
                HIGH) icon=':orange_circle:'; label='High' ;;
                MEDIUM) icon=':yellow_circle:'; label='Medium' ;;
                LOW) icon=':green_circle:'; label='Low' ;;
                UNKNOWN) icon=':white_circle:'; label='Unknown' ;;
              esac
              before="$(count "$severity" reports/upstream.json)"
              after="$(count "$severity" reports/immutable.json)"
              delta="$(change "$severity")"
              printf '| %s %s | %s | %s | **%s** |\n' "$icon" "$label" "$before" "$after" "$delta"
            done
            echo
            echo 'Negative change means fewer findings after rebuilding. Findings are counts from this scan'
            echo "database snapshot, not a security guarantee."
            echo
            echo '## Images'
            echo
            echo "- Before: \`$UPSTREAM_REF\`"
            echo "- After: \`$IMMUTABLE_REF\`"
            if [[ "$has_nonroot" == true ]]; then
              echo "- Non-root: \`$NONROOT_IMMUTABLE_REF\`"
            fi
            echo
            echo '## Detailed Reports'
            echo
            echo "Download [trivy-reports-$GITHUB_RUN_ID]($run_url) from workflow artifacts."
            echo
            echo '- `upstream.md`: detailed Before findings.'
            echo '- `immutable.md`: detailed After findings.'
            if [[ "$has_nonroot" == true ]]; then
              echo '- `nonroot.md`: detailed non-root findings.'
            fi
            echo '- `comparison.md`: machine-generated severity comparison.'
            if [[ "$has_nonroot" == true ]]; then
              echo '- `upstream.json`, `immutable.json`, and `nonroot.json`: raw Trivy output.'
            else
              echo '- `upstream.json` and `immutable.json`: raw Trivy output.'
            fi
          } > reports/trivy.md

          nonroot_critical=0
          nonroot_high=0
          nonroot_medium=0
          nonroot_low=0
          nonroot_unknown=0
          if [[ "$has_nonroot" == true ]]; then
            nonroot_critical="$(count CRITICAL reports/nonroot.json)"
            nonroot_high="$(count HIGH reports/nonroot.json)"
            nonroot_medium="$(count MEDIUM reports/nonroot.json)"
            nonroot_low="$(count LOW reports/nonroot.json)"
            nonroot_unknown="$(count UNKNOWN reports/nonroot.json)"
          fi

          jq -n \
            --arg scan_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson workflow_run "$GITHUB_RUN_ID" \
            --arg upstream_ref "$UPSTREAM_REF" \
            --arg rebuilt_ref "$IMMUTABLE_REF" \
            --arg nonroot_ref "$NONROOT_IMMUTABLE_REF" \
            --argjson has_nonroot "$has_nonroot" \
            --argjson nonroot_critical "$nonroot_critical" \
            --argjson nonroot_high "$nonroot_high" \
            --argjson nonroot_medium "$nonroot_medium" \
            --argjson nonroot_low "$nonroot_low" \
            --argjson nonroot_unknown "$nonroot_unknown" \
            --argjson upstream_critical "$(count CRITICAL reports/upstream.json)" \
            --argjson upstream_high "$(count HIGH reports/upstream.json)" \
            --argjson upstream_medium "$(count MEDIUM reports/upstream.json)" \
            --argjson upstream_low "$(count LOW reports/upstream.json)" \
            --argjson upstream_unknown "$(count UNKNOWN reports/upstream.json)" \
            --argjson rebuilt_critical "$(count CRITICAL reports/immutable.json)" \
            --argjson rebuilt_high "$(count HIGH reports/immutable.json)" \
            --argjson rebuilt_medium "$(count MEDIUM reports/immutable.json)" \
            --argjson rebuilt_low "$(count LOW reports/immutable.json)" \
            --argjson rebuilt_unknown "$(count UNKNOWN reports/immutable.json)" \
            '{
              scanDate: $scan_date,
              workflowRun: $workflow_run,
              upstream: {
                reference: $upstream_ref,
                critical: $upstream_critical,
                high: $upstream_high,
                medium: $upstream_medium,
                low: $upstream_low,
                unknown: $upstream_unknown
              },
              rebuilt: {
                reference: $rebuilt_ref,
                critical: $rebuilt_critical,
                high: $rebuilt_high,
                medium: $rebuilt_medium,
                low: $rebuilt_low,
                unknown: $rebuilt_unknown
              },
              nonroot: {
                reference: $nonroot_ref,
                critical: $nonroot_critical,
                high: $nonroot_high,
                medium: $nonroot_medium,
                low: $nonroot_low,
                unknown: $nonroot_unknown
              }
            } | if $has_nonroot then . else del(.nonroot) end' > reports/trivy.json

      - name: Update mutable tags after successful builds and scans
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "$IMMUTABLE_REF"
          docker buildx imagetools create \
            --tag "${NONROOT_IMAGE}:latest" \
            "$NONROOT_IMMUTABLE_REF"

      - name: Commit Trivy report to main
        # `main` is committed directly by design. A ruleset enforces
        # non_fast_forward, so we only ever fast-forward; the required_signatures
        # rule was removed because GITHUB_TOKEN automation cannot produce a
        # verified commit (see linked issue). Retries handle a concurrent push
        # landing between our fetch and our push.
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          report_dir="$RUNNER_TEMP/trivy-report"
          rm -rf "$report_dir"
          mkdir -p "$report_dir"
          cp reports/trivy.md reports/trivy.json \
            reports/source-vulnerabilities.md reports/source-vulnerabilities.json "$report_dir/"
          git reset --hard HEAD

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main

            cp "$report_dir/trivy.md" reports/trivy.md
            cp "$report_dir/trivy.json" reports/trivy.json
            cp "$report_dir/source-vulnerabilities.md" reports/source-vulnerabilities.md
            cp "$report_dir/source-vulnerabilities.json" reports/source-vulnerabilities.json
            git add reports/trivy.md reports/trivy.json \
              reports/source-vulnerabilities.md reports/source-vulnerabilities.json

            if git diff --cached --quiet; then
              echo 'Trivy report unchanged'
              exit 0
            fi

            unexpected_files="$(git diff --cached --name-only | grep -vE '^(reports/(trivy\.(md|json)|source-vulnerabilities\.(md|json)))$' || true)"
            if [[ -n "$unexpected_files" ]]; then
              echo 'Unexpected files staged for Trivy report update' >&2
              printf '%s\n' "$unexpected_files" >&2
              exit 1
            fi

            git commit -m 'docs: update Trivy report'
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push to main rejected (attempt $attempt); refetching" >&2
            git reset --hard HEAD~1
          done

          echo 'Could not push Trivy report to main after 3 attempts' >&2
          exit 1

      - name: Write failure metadata
        if: ${{ failure() || cancelled() }}
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          mkdir -p reports
          {
            echo "workflow=$GITHUB_WORKFLOW"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "ref=$WORKFLOW_REF"
            echo "sha=$GITHUB_SHA"
            echo "job=build"
            echo "status=failure-or-cancelled"
          } > reports/failure-metadata.txt
          ls -la reports

      - name: Prepare vulnerability report artifact
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/trivy-artifact"
          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir/trivy-source"
          if [[ -d reports ]]; then
            cp -a reports/. "$artifact_dir/"
          fi
          for report in wrapper.json upstream.json; do
            source_report="$RUNNER_TEMP/trivy-source/$report"
            if [[ -f "$source_report" ]]; then
              cp "$source_report" "$artifact_dir/trivy-source/$report"
            fi
          done

      - name: Upload vulnerability reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-reports-${{ github.run_id }}
          path: ${{ runner.temp }}/trivy-artifact/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          overwrite: true
          compression-level: 6

      - name: Add vulnerability comparison to job summary
        if: ${{ always() }}
        shell: bash
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -f reports/comparison.md ]]; then
            {
              echo
              echo '### Vulnerability comparison'
              cat reports/comparison.md
              echo
              echo "Reports: [workflow artifacts]($RUN_URL)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
